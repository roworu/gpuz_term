name: Test

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "LICENSE" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "LICENSE" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
      
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang cmake pkg-config \
          libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
          libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
          libasound2-dev libssl-dev libzstd-dev
          
    - uses: Swatinem/rust-cache@v2

    - name: Format
      run: cargo fmt --check

    - name: Build
      run: cargo build --verbose

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Run tests
      shell: bash
      run: cargo test --verbose 2>&1 | tee test-output.txt

    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-output
        path: test-output.txt

  deny:

    runs-on: ubuntu-26.04

    steps:

    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Check advisories, licenses, bans and sources
      uses: EmbarkStudios/cargo-deny-action@v2

  zizmor:

    runs-on: ubuntu-26.04

    permissions:
      contents: read
      security-events: write

    steps:

    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Audit workflows
      uses: zizmorcore/zizmor-action@v0.6.4

  gitleaks:

    runs-on: ubuntu-26.04

    env:
      GITLEAKS_VERSION: 8.30.1

    steps:

    - uses: actions/checkout@v6
      with:
        # scan the whole history, not just the last commit
        fetch-depth: 0
        persist-credentials: false

    - name: Scan for secrets
      run: |
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
        ./gitleaks git --redact --verbose

  codeql:

    runs-on: ubuntu-26.04

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:

    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: rust
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:rust"
        output: codeql-results

    - name: Upload CodeQL results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: codeql-results
        path: codeql-results
