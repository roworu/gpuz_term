# headless output for the wayland e2e session, as big as the xvfb screen so a 900x600 window fits at scale 2
output HEADLESS-1 resolution 3840x2160 scale 1
# the client area is the whole window, like under openbox
default_border none
default_floating_border none
focus_follows_mouse no
# floating keeps the 900x600 size the app asks for
for_window [app_id=".*"] floating enable
seat seat0 hide_cursor 0
xwayland disable
